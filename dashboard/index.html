<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Arroyo Store — Owner Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1b2a;--sur:#162636;--sur2:#0a1826;--bdr:#1e3a52;--txt:#e0f0ff;
  --mut:#5d8aa8;--brand:#66487a;--grn:#2ecc71;--red:#e74c3c;--yel:#f1c40f;--org:#e67e22;
}
body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
button{font-family:inherit}
.hide{display:none!important}

/* ── gate ── */
.gate{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.gbox{width:100%;max-width:380px;background:var(--sur);border:1px solid var(--bdr);border-radius:10px;padding:26px;text-align:center}
.glogo{width:64px;height:64px;border-radius:12px;margin:0 auto 12px;background:var(--brand);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;overflow:hidden}
.glogo img{width:100%;height:100%;object-fit:contain}
.gbox h1{font-size:19px;margin-bottom:3px}
.gbox .sub{font-size:12px;color:var(--mut);margin-bottom:18px}
.gin{width:100%;height:40px;background:var(--sur2);border:1.5px solid var(--bdr);border-radius:6px;color:var(--txt);
  font-size:14px;padding:0 12px;outline:none;margin-bottom:9px}
.gin:focus{border-color:#5dade2}
.gbtn{width:100%;height:42px;background:var(--brand);color:#fff;border:none;border-radius:6px;font-size:15px;font-weight:700;cursor:pointer}
.gbtn:disabled{opacity:.5;cursor:not-allowed}
.gerr{font-size:12px;color:var(--red);margin-top:9px;min-height:16px;line-height:1.5}
.ghint{font-size:11px;color:var(--mut);margin-top:12px;line-height:1.6;text-align:left}

/* ── shell ── */
.shell{display:flex;min-height:100vh}
.side{width:210px;flex-shrink:0;background:var(--sur2);border-right:1px solid var(--bdr);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sbrand{padding:15px 14px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:9px}
.sbrand .lg{width:32px;height:32px;border-radius:7px;background:var(--brand);display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;overflow:hidden}
.sbrand .lg img{width:100%;height:100%;object-fit:contain}
.sbrand .nm{font-size:13px;font-weight:700;line-height:1.25;overflow:hidden}
.nav{flex:1;padding:8px 0;overflow-y:auto}
.nv{display:flex;align-items:center;gap:9px;padding:10px 14px;font-size:13px;color:var(--mut);cursor:pointer;border-left:3px solid transparent}
.nv:hover{background:#0f2336;color:var(--txt)}
.nv.on{background:#0f2336;color:var(--txt);border-left-color:var(--brand);font-weight:600}
.sfoot{padding:10px 14px;border-top:1px solid var(--bdr);font-size:11px;color:var(--mut);line-height:1.6}
.main{flex:1;padding:18px 20px 40px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.ph h2{font-size:19px;font-weight:800}
.ph .sub{font-size:12px;color:var(--mut);margin-top:2px}

/* ── bits ── */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;margin-bottom:18px}
.card{background:var(--sur);border:1px solid var(--bdr);border-radius:8px;padding:12px 14px}
.card .k{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-bottom:5px}
.card .v{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.card .n{font-size:11px;color:var(--mut);margin-top:3px}
.panel{background:var(--sur);border:1px solid var(--bdr);border-radius:8px;padding:15px;margin-bottom:16px}
.panel h3{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);
  text-align:left;padding:7px 8px;border-bottom:1px solid var(--bdr);background:var(--sur2);position:sticky;top:0}
td{padding:7px 8px;border-bottom:1px solid #16293c}
tr:hover td{background:#0f2336}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.scroll{max-height:460px;overflow:auto;border:1px solid var(--bdr);border-radius:6px}
.btn{background:var(--brand);color:#fff;border:none;border-radius:5px;padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer}
.btn.g{background:#1a6e3a}.btn.r{background:#962d22}.btn.o{background:none;border:1px solid var(--bdr);color:var(--mut)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.xs{padding:4px 8px;font-size:11px}
.in{background:var(--sur2);border:1px solid var(--bdr);border-radius:5px;color:var(--txt);font-size:13px;padding:6px 9px;outline:none;font-family:inherit}
.in:focus{border-color:#5dade2}
.tin{width:100%;background:transparent;border:1px solid transparent;border-radius:3px;color:var(--txt);
  font-size:13px;padding:3px 5px;outline:none;font-family:inherit;text-align:right;font-variant-numeric:tabular-nums}
.tin:hover{border-color:var(--bdr)}.tin:focus{border-color:#5dade2;background:var(--sur2)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tabs{display:flex;gap:2px;margin-bottom:12px;border-bottom:1px solid var(--bdr)}
.tab{padding:8px 14px;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--txt);border-bottom-color:var(--brand)}
.pill{display:inline-block;padding:2px 7px;border-radius:9px;font-size:10px;font-weight:700}
.p-ok{background:#123d24;color:#7dcea0}.p-vd{background:#3d1512;color:#f1948a}
.p-rt{background:#3d3212;color:#f0d27a}.p-lo{background:#4a2e00;color:#f0b27a}
.empty{padding:36px;text-align:center;color:#3d5a73;font-size:13px}
.err{background:#2a1010;border:1px solid #6b2020;color:#f1948a;border-radius:6px;padding:9px 12px;font-size:12px;margin-bottom:12px;line-height:1.5}
.warn{background:#2a1f0a;border:1px solid #8a5a1a;color:#e8c88a;border-radius:6px;padding:9px 12px;font-size:12px;margin-bottom:12px;line-height:1.55}
.note{background:#0a1f2e;border:1px solid #2a6496;color:#aed6f1;border-radius:6px;padding:9px 12px;font-size:12px;margin-bottom:12px;line-height:1.55}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);background:#1a3a5c;color:#7ec8f0;
  border:1px solid #2a6496;padding:9px 20px;border-radius:16px;font-size:13px;opacity:0;transition:all .3s;pointer-events:none;z-index:400}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(5,12,20,.86);z-index:300;display:none;align-items:center;justify-content:center;padding:18px}
.modal.on{display:flex}
.mbox{background:var(--sur);border:1px solid var(--bdr);border-radius:9px;padding:18px;width:100%;max-width:440px;max-height:88vh;overflow:auto}
.mbox h3{font-size:15px;margin-bottom:10px}
.fr{margin-bottom:9px}
.fr label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
.fr .in{width:100%}
.live{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--mut)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--grn)}
.dot.stale{background:var(--org)}.dot.dead{background:var(--red)}
@media(max-width:820px){
  .shell{flex-direction:column}
  .side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap}
  .nav{display:flex;overflow-x:auto;padding:0}
  .nv{border-left:none;border-bottom:3px solid transparent;white-space:nowrap}
  .nv.on{border-left:none;border-bottom-color:var(--brand)}
  .sfoot{display:none}
  .main{padding:14px}
}
@media print{
  .side,.bar,.ph .btn,#toast{display:none!important}
  body{background:#fff;color:#000}
  .panel,.card{border-color:#ccc;background:#fff}
}
</style>
</head>
<body>

<!-- ══ GATE ══ -->
<div class="gate" id="gate">
  <div class="gbox">
    <div class="glogo" id="g-logo"></div>
    <h1 id="g-name">Arroyo Store</h1>
    <div class="sub">Owner Dashboard</div>

    <div id="g-step1">
      <input class="gin" type="password" id="g-pass" placeholder="Dashboard password" autocomplete="current-password"/>
      <button class="gbtn" id="g-b1">Unlock</button>
    </div>

    <div id="g-step2" class="hide">
      <div class="ghint" style="margin:0 0 12px;text-align:center;color:var(--grn)">&#10003; Unlocked</div>
      <input class="gin" type="email" id="g-email" placeholder="Supabase login e-mail" autocomplete="username"/>
      <div id="g-emailnote" class="hide" style="font-size:11px;color:var(--mut);margin:-4px 0 9px;text-align:left"></div>
      <input class="gin" type="password" id="g-sbpass" placeholder="Supabase password" autocomplete="current-password"/>
      <button class="gbtn" id="g-b2">Sign in</button>
      <div class="ghint">
        This is the <b>owner</b> login you created in Supabase &rarr; Authentication &rarr; Users, and added to
        <code>store_members</code>. It is not a till login and it is never stored in this file &mdash; only in this
        browser tab, until you close it.
      </div>
    </div>

    <div class="gerr" id="g-err"></div>
  </div>
</div>

<!-- ══ SHELL ══ -->
<div class="shell hide" id="shell">
  <aside class="side">
    <div class="sbrand">
      <div class="lg" id="s-logo"></div>
      <div class="nm" id="s-name">Arroyo Store</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sfoot">
      <div class="live"><span class="dot" id="live-dot"></span><span id="live-txt">connecting</span></div>
      <div style="margin-top:5px" id="s-user"></div>
      <div style="margin-top:6px"><a href="#" id="s-out" style="color:var(--mut)">Sign out</a></div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>

/* The trading day as the tills record it: Manila, YYYY-MM-DD. Using the
   laptop's own date here would silently disagree with the till whenever
   the owner is travelling. */
function dayKey(d){
  try { return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Manila'}).format(d?new Date(d):new Date()); }
  catch(e){ return new Date(d||Date.now()).toISOString().slice(0,10); }
}
function addDays(k, n){ var d=new Date(k+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
/* The hour of a sale in Manila, not on whatever clock the laptop is set to.
   Everything else in this project is careful about this; one getHours() call
   quietly undid it for the peak-hours chart. */
function manilaHour(at){
  try{
    return parseInt(new Intl.DateTimeFormat('en-GB',{
      timeZone:'Asia/Manila', hour:'2-digit', hour12:false
    }).format(new Date(at)), 10) || 0;
  }catch(e){ return new Date(at).getHours(); }
}
function hhmm(ts){ try{ return new Date(ts).toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
function dmy(ts){ try{ return new Date(ts).toLocaleDateString('en-PH',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return ''; } }

/* Same hash the builder used to write DASH_HASH. Must stay identical or
   the password will never match. */
var PIN_ROUNDS = 3000000;
function hashPinV2(pin, salt){
  var h1=0x811c9dc5>>>0, h2=0x1000193>>>0, h3=0x9e3779b9>>>0;
  var s=String(salt)+':'+String(pin)+':'+String(salt);
  for(var i=0;i<s.length;i++){
    h1=Math.imul(h1^s.charCodeAt(i),16777619)>>>0;
    h2=Math.imul(h2+s.charCodeAt(i),2246822519)>>>0;
  }
  for(var r=0;r<PIN_ROUNDS;r++){
    h1=Math.imul(h1^(h1>>>15),2246822519)>>>0;
    h2=Math.imul(h2+h1+r,3266489917)>>>0;
    h3=Math.imul(h3^h2,668265263)>>>0;
    h1=(h1+h3)>>>0;
  }
  return 'h2$'+h1.toString(36)+h2.toString(36)+h3.toString(36);
}

/* ══════════════════════════════════════════════════════════════════════
   AUTH
   Two locks, because they stop different things. The dashboard password
   stops someone walking past an open laptop. The Supabase login is what
   the database actually enforces; without it every query returns [].
   Session lives in sessionStorage, so closing the tab ends it.
   ══════════════════════════════════════════════════════════════════════ */
var SESS = { tok:'', exp:0, email:'', refresh:'' };
var SKEY = 'dash_sess_' + (CFG.storeId||'x');

/* Where the session lives is a real trade-off, so it is worth stating.
   The access token is short-lived and stays in sessionStorage — it dies
   with the tab. The REFRESH token goes to localStorage, so the owner types
   their password once on this machine instead of once per tab. That is the
   difference between a dashboard you actually look at and one you avoid.

   What it costs: anyone with the unlocked laptop can reach the dashboard
   until Sign out is pressed. The dashboard password gate is what stands in
   front of that, which is why it is a separate secret from the Supabase
   one. On a shared machine, press Sign out — it revokes the refresh token
   as well as clearing it. */
function loadSess(){
  try{
    var a=JSON.parse(sessionStorage.getItem(SKEY)||'null');
    if(a && a.tok && a.exp > Date.now()+30000){ SESS=a; return true; }
  }catch(e){}
  return false;
}
function savedRefresh(){
  try{ var r=JSON.parse(localStorage.getItem(SKEY+'_r')||'null');
       return (r && r.refresh) ? r : null; }catch(e){ return null; }
}
function saveSess(){
  try{ sessionStorage.setItem(SKEY, JSON.stringify(SESS)); }catch(e){}
  try{
    if(SESS.refresh) localStorage.setItem(SKEY+'_r',
      JSON.stringify({refresh:SESS.refresh, email:SESS.email}));
  }catch(e){}
}
function dropSess(){
  var r=SESS.refresh;
  SESS={tok:'',exp:0,email:'',refresh:''};
  try{ sessionStorage.removeItem(SKEY); }catch(e){}
  try{ localStorage.removeItem(SKEY+'_r'); }catch(e){}
  /* Tell Supabase too, so a token copied off this machine stops working. */
  if(r) fetch(CFG.url+'/auth/v1/logout',{method:'POST',
    headers:{'apikey':CFG.key,'Content-Type':'application/json'},
    body:JSON.stringify({refresh_token:r})}).catch(function(){});
}

/* Exchange a stored refresh token for a fresh access token. */
function resume(){
  var r=savedRefresh();
  if(!r) return Promise.resolve(false);
  return fetch(CFG.url+'/auth/v1/token?grant_type=refresh_token',{
    method:'POST',
    headers:{'apikey':CFG.key,'Content-Type':'application/json'},
    body:JSON.stringify({refresh_token:r.refresh})
  }).then(function(res){ return res.json().then(function(j){
    if(!res.ok || !j.access_token) throw new Error('refresh rejected');
    SESS={ tok:j.access_token, exp:Date.now()+((j.expires_in||3600)-60)*1000,
           email:(j.user&&j.user.email)||r.email||'', refresh:j.refresh_token||r.refresh };
    saveSess(); return true;
  }); }).catch(function(){
    try{ localStorage.removeItem(SKEY+'_r'); }catch(e){}
    return false;
  });
}

function signIn(email, pass){
  return fetch(CFG.url+'/auth/v1/token?grant_type=password',{
    method:'POST',
    headers:{'apikey':CFG.key,'Content-Type':'application/json'},
    body:JSON.stringify({email:email,password:pass})
  }).then(function(r){ return r.json().then(function(j){
    if(!r.ok || !j.access_token) throw new Error(j.error_description||j.msg||j.error||'sign-in failed');
    SESS={ tok:j.access_token, exp:Date.now()+((j.expires_in||3600)-60)*1000,
           email:email, refresh:j.refresh_token||'' };
    saveSess(); return true;
  }); });
}

/* Every read goes through here, so there is exactly one place that can
   report a failure and exactly one place that knows the session died. */
function api(path, opts){
  /* An access token lasts an hour and the dashboard is left open all day,
     so expiry is the normal case rather than an error. Try the refresh
     token before sending the owner back to the login screen. */
  if(!SESS.tok || SESS.exp < Date.now()){
    return resume().then(function(ok){
      if(!ok){ dropSess(); showGate('Session expired \u2014 sign in again.');
               throw new Error('no session'); }
      return api(path, opts);
    });
  }
  opts=opts||{};
  opts.headers=Object.assign({
    'apikey':CFG.key,'Authorization':'Bearer '+SESS.tok,'Content-Type':'application/json'
  }, opts.headers||{});
  return fetch(CFG.url+'/rest/v1/'+path, opts).then(function(r){
    if(r.status===401){ dropSess(); showGate('Session expired \u2014 sign in again.'); throw new Error('401'); }
    if(!r.ok) return r.text().then(function(t){ throw new Error(r.status+' '+t.slice(0,200)); });
    if(opts.method==='DELETE'||opts.method==='PATCH') return null;
    return r.json();
  });
}
function sel(table, qs){
  return api(table+'?store_id=eq.'+encodeURIComponent(CFG.storeId)+(qs?('&'+qs):''));
}

  this.disabled=true; this.textContent='Checking\u2026';
  var btn=this;
  // 3,000,000 rounds blocks the thread for a moment; let the label paint.
  setTimeout(function(){
    var ok = hashPinV2(v, CFG.dashSalt) === CFG.dashHash;
    btn.disabled=false; btn.textContent='Unlock';
    if(!ok){ $('g-err').textContent='Wrong password.'; $('g-pass').value=''; return; }
    $('g-err').textContent='';
    $('g-step1').classList.add('hide');
    $('g-step2').classList.remove('hide');
    var pre = SESS.email || (savedRefresh()||{}).email || CFG.ownerEmail || '';
    if(pre){
      $('g-email').value=pre;
      var n=$('g-emailnote');
      n.textContent='Set when this dashboard was generated \u2014 change it if you sign in as someone else.';
      n.classList.remove('hide');
      $('g-sbpass').focus();
    } else {
      $('g-email').focus();
    }
  }, 30);
};

/* ══════════════════════════════════════════════════════════════════════
   LIVE UPDATES  —  polling, not push

   The spec asked for Supabase Realtime over a WebSocket. Doing that
   without supabase-js means hand-rolling the Phoenix channel protocol:
   heartbeats, join refs, rejoin-after-drop. That is a few hundred lines
   I cannot exercise here, and a subtly wrong reconnect would show the
   owner stale figures while looking connected — worse than honest
   polling, because it lies quietly.

   So: poll on an interval, show when the data was last refreshed, and
   let the operator force a refresh. Typical lag is half the interval.
   If you later add supabase-js, subscribe and call refresh() from the
   handler; everything below already re-renders from scratch.
   ══════════════════════════════════════════════════════════════════════ */
var LIVE = { timer:null, tick:null, last:0, ms:(CFG.pollMs||10000), failures:0 };

/* Which panels are monitors and which are editors.
   A monitor is worth re-reading on a timer. An editor must never be
   repainted underneath someone's hands: refresh() rebuilds the panel with
   innerHTML, so a poll landing mid-edit destroys the field before onchange
   fires and the typed value is lost for good. Inventory price edits were
   unusable for exactly this reason. Editors get a manual Refresh button. */
var POLLED = { overview:1, txns:1, cash:1 };

/* True while the operator is typing or has a dialog open. */
function busyEditing(){
  var m=$('modal');
  if(m && m.classList.contains('on')) return true;
  var a=document.activeElement;
  if(!a) return false;
  var t=(a.tagName||'').toUpperCase();
  return t==='INPUT' || t==='SELECT' || t==='TEXTAREA' || a.isContentEditable===true;
}

function liveTick(){
  var d=$('live-dot'), t=$('live-txt');
  if(!d) return;
  var age=Date.now()-LIVE.last;
  if(LIVE.failures>2){ d.className='dot dead'; t.textContent='not updating'; }
  else if(!POLLED[active]){ d.className='dot'; t.textContent='on demand'; }
  else if(age>LIVE.ms*3){ d.className='dot stale'; t.textContent='stale'; }
  else { d.className='dot'; t.textContent='updated '+(LIVE.last?hhmm(LIVE.last):'\u2014'); }
}
function startLive(){
  if(LIVE.timer) clearInterval(LIVE.timer);
  LIVE.timer=setInterval(function(){
    if(document.hidden) return;              // do not poll a background tab
    if(!POLLED[active]) return;              // editors refresh on demand
    refresh(true);
  }, LIVE.ms);
  /* Cleared and re-created rather than stacked. boot() runs again on every
     sign-in, so an untracked handle meant three logins left three timers
     running for the life of the tab. */
  if(LIVE.tick) clearInterval(LIVE.tick);
  LIVE.tick=setInterval(liveTick, 2000);
}

/* ══════════════════════════════════════════════════════════════════════
   PANELS
   ══════════════════════════════════════════════════════════════════════ */
var PANELS = [
  {id:'overview', icon:'\uD83D\uDCCA', label:'Overview'},
  {id:'txns',     icon:'\uD83E\uDDFE', label:'Transactions'},
  {id:'inv',      icon:'\uD83D\uDCE6', label:'Inventory'},
  {id:'staff',    icon:'\uD83D\uDC65', label:'Staff'},
  {id:'cash',     icon:'\uD83D\uDCB0', label:'Cash Flow'},
  {id:'reports',  icon:'\uD83D\uDCC8', label:'Reports'},
  {id:'settings', icon:'\u2699',       label:'Settings'}
];
var active='overview';
var STATE = { today:dayKey(), from:addDays(dayKey(),-29), to:dayKey() };

function buildNav(){
  $('nav').innerHTML = PANELS.map(function(p){
    return '<div class="nv'+(p.id===active?' on':'')+'" data-p="'+p.id+'">'+
           '<span>'+p.icon+'</span><span>'+p.label+'</span></div>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('.nv'), function(el){
    el.onclick=function(){ active=el.getAttribute('data-p'); buildNav(); refresh(); };
  });
}

/* Panels excluded from the poll need a way to be brought up to date. */
var REFRESH_BTN = '<button class="btn o xs" onclick="refresh()">Refresh</button>';

function head(title, sub, extra){
  return '<div class="ph"><div><h2>'+esc(title)+'</h2>'+
         (sub?'<div class="sub">'+sub+'</div>':'')+'</div><div class="bar" style="margin:0">'+(extra||'')+'</div></div>';
}
function errBox(e){
  return '<div class="err"><b>Could not load.</b> '+esc(String(e.message||e).slice(0,300))+
    '<br>If this says <code>401</code> or returns nothing, the signed-in user is probably not in '+
    '<code>store_members</code> for this store.</div>';
}
function tbl(cols, rows, emptyMsg){
  if(!rows.length) return '<div class="empty">'+esc(emptyMsg||'Nothing here yet.')+'</div>';
  return '<div class="scroll"><table><thead><tr>'+
    cols.map(function(c){ return '<th'+(c.r?' class="r"':'')+'>'+c.h+'</th>'; }).join('')+
    '</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';
}

function refresh(quiet){
  /* A background poll never wins against the person using the page. */
  if(quiet && busyEditing()) return Promise.resolve();

  /* #2 — the trading day was captured once at load, so a dashboard left
     open overnight kept reporting yesterday as today: the morning's sales
     read as zero and the obvious conclusion was that the till had stopped
     syncing. Re-derive on every pass instead. */
  var k=dayKey();
  if(k!==STATE.today){
    var wasToday = (STATE.to===STATE.today);
    STATE.today=k;
    if(wasToday || STATE.to<k){ STATE.to=k; STATE.from=addDays(k,-29); }
  }

  if(!quiet) $('main').innerHTML='<div class="empty">Loading\u2026</div>';
  var fn = ({overview:pOverview, txns:pTxns, inv:pInv, staff:pStaff,
             cash:pCash, reports:pReports, settings:pSettings})[active];
  return fn().then(function(){
    LIVE.last=Date.now(); LIVE.failures=0; liveTick();
  }).catch(function(e){
    LIVE.failures++; liveTick();
    if(String(e.message)!=='no session' && String(e.message)!=='401'){
      $('main').innerHTML=head('Error','')+errBox(e);
    }
  });
}

/* ── OVERVIEW ─────────────────────────────────────────────────────── */
function pOverview(){
  var d=STATE.today;
  return Promise.all([
    sel('sales','biz_date=eq.'+d+'&select=inv,till_id,type,total,cashier,at,payload&order=at.desc'),
    sel('product_stock','select=bc,name,stock,rl,exp,price,cost'),
    sel('expenses','biz_date=eq.'+d+'&select=amount'),
    sel('waste_logs','biz_date=eq.'+d+'&select=total_cost')
  ]).then(function(res){
    var sales=res[0]||[], stock=res[1]||[], exp=res[2]||[], waste=res[3]||[];
    var ok=sales.filter(function(s){ return s.type==='sale'; });
    var gross=ok.reduce(function(a,s){ return r2(a+Number(s.total||0)); },0);
    var rets =sales.filter(function(s){return s.type==='return';}).reduce(function(a,s){return r2(a+Number(s.total||0));},0);
    var voids=sales.filter(function(s){return s.type==='void';}).reduce(function(a,s){return r2(a+Number(s.total||0));},0);
    var disc =ok.reduce(function(a,s){ var p=s.payload||{}; return r2(a+Number(p.disc||0)+Number(p.senDisc||0)); },0);
    var cogs =ok.reduce(function(a,s){ var p=s.payload||{}; return r2(a+Number(p.cost||0)); },0);
    var expT =exp.reduce(function(a,e){ return r2(a+Number(e.amount||0)); },0);
    var wstT =waste.reduce(function(a,w){ return r2(a+Number(w.total_cost||0)); },0);
    var cash =ok.filter(function(s){ return (s.payload||{}).pay==='cash'; })
                .reduce(function(a,s){ return r2(a+Number(s.total||0)); },0);
    var net=r2(gross-rets);
    var low=stock.filter(function(p){ return Number(p.stock) <= Number(p.rl||5); });
    var soon=stock.filter(function(p){
      if(!p.exp) return false;
      /* Slice to the date part so a full timestamp still parses. An
         unparseable value used to yield NaN, and NaN<=7 is false, so an
         expiring item was silently dropped from the count - failing in the
         unsafe direction for a pharmacy or a bakery. */
      var t=Date.parse(String(p.exp).slice(0,10)+'T00:00:00Z');
      if(!isFinite(t)) return false;
      return (t-Date.parse(d+'T00:00:00Z'))/86400000 <= 7;
    });

    // sales by hour, from the receipts themselves
    var byHour=new Array(24).fill(0);
    ok.forEach(function(s){
      var h=manilaHour(s.at);
      byHour[h]=r2(byHour[h]+Number(s.total||0));
    });

    var cards=[
      ['Gross sales', money(gross), num(ok.length)+' sale'+(ok.length===1?'':'s')],
      ['Net sales', money(net), rets?('less '+money(rets)+' returned'):'no returns'],
      ['Discounts given', money(disc), ''],
      /* With no cost prices loaded, cogs is 0 and "margin" equals net sales -
         a 100% margin stated as fact. Show nothing rather than a number
         the owner might act on. */
      ['Gross margin', cogs>0 ? money(r2(net-cogs)) : '\u2014',
       cogs>0 ? ('COGS '+money(cogs)) : 'enter item costs to see margin'],
      ['After costs', money(r2(net-cogs-expT-wstT)), 'less expenses & waste'],
      ['Cash taken', money(cash), 'cash tenders only'],
      ['Voided', money(voids), num(sales.filter(function(s){return s.type==='void';}).length)+' document(s)'],
      ['Low stock', num(low.length), low.length?'at or below reorder level':'all above reorder'],
      ['Expiring \u2264 7d', num(soon.length), soon.length?'check the shelf':'nothing near expiry']
    ].map(function(c){
      return '<div class="card"><div class="k">'+c[0]+'</div><div class="v">'+c[1]+'</div>'+
             (c[2]?'<div class="n">'+esc(c[2])+'</div>':'')+'</div>';
    }).join('');

    var rows=sales.slice(0,20).map(function(s){
      var p=s.payload||{};
      var badge = s.type==='sale'?'<span class="pill p-ok">sale</span>'
                : s.type==='void'?'<span class="pill p-vd">void</span>'
                : '<span class="pill p-rt">return</span>';
      return '<tr><td>'+hhmm(s.at)+'</td><td>'+esc(s.inv)+'</td><td>'+esc(s.till_id||'')+'</td>'+
        '<td>'+esc(s.cashier||'')+'</td><td class="r">'+num((p.items||[]).length)+'</td>'+
        '<td class="r">'+money(s.total)+'</td><td>'+esc(String(p.pay||'').toUpperCase())+'</td>'+
        '<td>'+badge+'</td></tr>';
    });

    $('main').innerHTML =
      head('Overview', esc(dmy(d))+' \u00b7 trading day '+esc(d),
        '<button class="btn o xs" onclick="refresh()">Refresh</button>') +
      (sales.length?'':'<div class="note">No sales recorded for this trading day yet. '+
        'If the till has been selling, check that it is signed in under <b>Settings &rarr; Multi-terminal sync</b>.</div>') +
      '<div class="cards">'+cards+'</div>'+
      '<div class="panel"><h3>Sales by hour</h3>'+barChart(byHour.map(function(v,i){
        return {label:(i<10?'0':'')+i, value:v};
      }))+'</div>'+
      '<div class="panel"><h3>Recent transactions</h3>'+tbl(
        [{h:'Time'},{h:'OR'},{h:'Till'},{h:'Cashier'},{h:'Items',r:1},{h:'Total',r:1},{h:'Pay'},{h:'Status'}],
        rows, 'No transactions on this trading day.')+'</div>';
  });
}

function pTxns(){

        '<td class="r">'+money(p.vat||0)+'</td><td class="r"><b>'+money(s.total)+'</b></td>'+

    });
    $('main').innerHTML =
      head('Transactions', num(f.length)+' of '+num(rows.length)+' in range',
        '<button class="btn o xs" onclick="exportTxns()">Export CSV</button>')+
      '<div class="bar">'+
        '<input class="in" id="f-from" type="date" value="'+STATE.from+'"/>'+
        '<span style="color:var(--mut)">to</span>'+
        '<input class="in" id="f-to" type="date" value="'+STATE.to+'"/>'+
        '<input class="in" id="f-q" placeholder="OR, cashier or item" value="'+esc(TXF.q)+'" style="min-width:190px"/>'+
        '<select class="in" id="f-type">'+opt(['','sale','void','return'],['All statuses','Sales','Voids','Returns'],TXF.type)+'</select>'+
        '<select class="in" id="f-pay">'+opt(['','cash','card','gcash','maya'],['All payments','Cash','Card','GCash','Maya'],TXF.pay)+'</select>'+
        '<button class="btn xs" onclick="applyTxF()">Apply</button>'+
      '</div>'+
      tbl([{h:'Date'},{h:'OR'},{h:'Till'},{h:'Cashier'},{h:'Subtotal',r:1},{h:'Disc',r:1},
           {h:'VAT',r:1},{h:'Total',r:1},{h:'Pay'},{h:'Status'},{h:''}],
          body, 'No transactions match.');
  });

window.applyTxF=function(){

};
function row2(a,b){ return '<div style="display:flex;justify-content:space-between;padding:2px 0">'+
  '<span style="color:var(--mut)">'+a+'</span><span>'+b+'</span></div>'; }

window.askDelete=function(i){
  var s=(window.__txns||[])[i]; if(!s) return;
  var p=s.payload||{}, n=(p.items||[]).length;
  modal('<h3 style="color:var(--red)">Permanently delete '+esc(s.inv)+'?</h3>'+
    '<div class="warn">This removes the sale from the database for good. There is no undo and no '+
    'archive copy &mdash; a hard delete is what the spec asks for, and it means exactly that.<br><br>'+
    'Stock for '+num(n)+' line item'+(n===1?'':'s')+' will be put back by writing a reversing '+
    '<code>void_reversal</code> movement, so the shelf count corrects itself and the reason stays visible '+
    'in the movement log.<br><br>'+
    '<b>BIR note.</b> A voided or returned sale is normally kept as a document, not erased. Deleting an '+
    'OR breaks the number sequence your Z-Readings are built on. Use the till&rsquo;s Void or Return for '+
    'anything you may have to account for later; use this only to clear test data.</div>'+
    '<div class="fr"><label>Reason (recorded in the audit log)</label>'+
    '<input class="in" id="del-why" placeholder="e.g. test transaction"/></div>'+
    '<div style="display:flex;gap:8px;margin-top:12px">'+
      '<button class="btn o" onclick="closeModal()">Cancel</button>'+
      '<button class="btn r" id="del-go" style="margin-left:auto">Delete permanently</button></div>');
  $('del-go').onclick=function(){ doDelete(s, $('del-why').value.trim()); };
};
function doDelete(s, why){
  var btn=$('del-go'); btn.disabled=true; btn.textContent='Deleting\u2026';
  var p=s.payload||{}, items=p.items||[];
  var now=new Date().toISOString();
  // Reversing movements first. If the delete then fails the stock is
  // briefly high, which a recount fixes; the other order would lose the
  // goods entirely.
  var moves=items.filter(function(i){ return i.bc && i.qty; }).map(function(i){
    return { id:uuid(), store_id:CFG.storeId, bc:String(i.bc), delta:Math.abs(Number(i.qty)||0),
             reason:'void_reversal', ref:String(s.inv), till_id:s.till_id||null, at:now };
  });
  var audit={ id:uuid(), store_id:CFG.storeId, till_id:s.till_id||null, biz_date:dayKey(),
              cashier:'dashboard:'+SESS.email, action:'sale_deleted',
              detail:'OR '+s.inv+' '+money(s.total)+(why?(' \u2014 '+why):'') , at:now };
  var chain=Promise.resolve();
  if(moves.length) chain=chain.then(function(){
    return api('stock_moves',{method:'POST',headers:{'Prefer':'resolution=ignore-duplicates,return=minimal'},
      body:JSON.stringify(moves)});
  });
  chain.then(function(){
    return api('sales?store_id=eq.'+encodeURIComponent(CFG.storeId)+
               '&till_id=eq.'+encodeURIComponent(s.till_id||'')+
               '&inv=eq.'+encodeURIComponent(s.inv),
               {method:'DELETE',headers:{'Prefer':'return=minimal'}});
  }).then(function(){
    return api('audit_logs',{method:'POST',headers:{'Prefer':'resolution=ignore-duplicates,return=minimal'},
      body:JSON.stringify([audit])});
  }).then(function(){
    closeModal(); toast('Deleted '+s.inv+' \u2014 stock reversed', 3000, '#962d22'); refresh();
  }).catch(function(e){
    btn.disabled=false; btn.textContent='Delete permanently';
    toast('Delete failed: '+String(e.message||e).slice(0,70), 4500, '#962d22');
  });
}
function uuid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
    var r=Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16); });
}
window.exportTxns=function(){
  var rows=[['Date','Time','OR','Till','Cashier','Subtotal','Discount','VAT','Total','Tender','Change','Payment','Status']];
  (window.__txns||[]).forEach(function(s){
    var p=s.payload||{};
    rows.push([s.biz_date||dayKey(s.at), hhmm(s.at), s.inv, s.till_id||'', s.cashier||'',
      r2(p.sub||s.total), r2(Number(p.disc||0)+Number(p.senDisc||0)), r2(p.vat||0), r2(s.total),
      r2(p.cash||0), r2(p.change||0), p.pay||'', s.type]);
  });
  dlCsv(rows, 'transactions_'+STATE.from+'_'+STATE.to+'.csv');
};
function dlCsv(rows, name){
  var csv=rows.map(function(r){ return r.map(function(c){
    var v=String(c==null?'':c);
    /* Excel treats a leading =, +, - or @ as a formula. A supplier note
       starting with "-" is far likelier here than an attack, but both are
       fixed the same way: prefix an apostrophe, which Excel reads as
       "this is literal text" and does not display. */
    if(/^[=+\-@\t\r]/.test(v)) v="'"+v;
    return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  }).join(','); }).join('\r\n');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));
  a.download=name; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
}

/* ── INVENTORY ────────────────────────────────────────────────────── */
var INVF={q:'',cat:''};
function pInv(){
  return sel('product_stock','select=bc,code,name,cat,unit,price,cost,stock,rl,sup,vx,exp&order=name.asc')
  .then(function(rows){
    rows=rows||[];
    var cats=[''].concat(Array.from(new Set(rows.map(function(p){return p.cat||'Other';}))).sort());
    var f=rows.filter(function(p){
      if(INVF.cat && (p.cat||'Other')!==INVF.cat) return false;
      if(INVF.q){
        var q=INVF.q.toLowerCase();
        if((p.name+' '+p.bc+' '+(p.code||'')).toLowerCase().indexOf(q)<0) return false;
      }
      return true;
    });
    window.__inv=f;
    var body=f.map(function(p,i){
      var low=Number(p.stock)<=Number(p.rl||5);
      return '<tr><td style="font-family:monospace;font-size:11px;color:var(--mut)">'+esc(p.bc)+'</td>'+
        '<td>'+esc(p.name)+(p.vx?' <span class="pill p-rt">VAT-ex</span>':'')+'</td>'+
        '<td>'+esc(p.cat||'Other')+'</td><td>'+esc(p.unit||'pcs')+'</td>'+
        '<td class="r"><input class="tin" value="'+r2(p.price)+'" onchange="invEdit('+i+',\'price\',this.value)"/></td>'+
        '<td class="r"><input class="tin" value="'+r2(p.cost)+'" onchange="invEdit('+i+',\'cost\',this.value)"/></td>'+
        '<td class="r"'+(low?' style="color:var(--org);font-weight:700"':'')+'>'+num(p.stock)+'</td>'+
        '<td class="r">'+num(p.rl||5)+'</td>'+
        '<td>'+(p.exp?esc(p.exp):'\u2014')+'</td>'+
        '<td><button class="btn o xs" onclick="stockIn('+i+')">Stock in</button></td></tr>';
    });
    $('main').innerHTML =
      head('Inventory', num(f.length)+' item'+(f.length===1?'':'s'),
        REFRESH_BTN+' <button class="btn o xs" onclick="exportInv()">Export CSV</button>')+
      '<div class="note">Stock is <b>derived</b> from the movement log, not stored as a number. '+
      'That is why there is no editable stock box here: to correct a count, use <b>Stock in</b>, which writes '+
      'a movement with a reason attached. Two tills can then both adjust the same item without either '+
      'overwriting the other.</div>'+
      '<div class="bar">'+
        '<input class="in" id="i-q" placeholder="name or barcode" value="'+esc(INVF.q)+'" style="min-width:200px"/>'+
        '<select class="in" id="i-cat">'+cats.map(function(c){
          return '<option value="'+esc(c)+'"'+(c===INVF.cat?' selected':'')+'>'+(c||'All categories')+'</option>';
        }).join('')+'</select>'+
        '<button class="btn xs" onclick="applyInvF()">Apply</button>'+
      '</div>'+
      tbl([{h:'Barcode'},{h:'Name'},{h:'Category'},{h:'Unit'},{h:'Price',r:1},{h:'Cost',r:1},
           {h:'Stock',r:1},{h:'Reorder',r:1},{h:'Expiry'},{h:''}], body, 'No products match.');
  });
}
window.applyInvF=function(){ INVF.q=$('i-q').value.trim(); INVF.cat=$('i-cat').value; refresh(); };
window.invEdit=function(i, field, val){
  var p=(window.__inv||[])[i]; if(!p) return;
  var v=r2(val);
  var body={}; body[field]=v; body.updated_at=new Date().toISOString();
  api('products?store_id=eq.'+encodeURIComponent(CFG.storeId)+'&bc=eq.'+encodeURIComponent(p.bc),
      {method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify(body)})
  .then(function(){ toast(p.name+' \u2014 '+field+' set to '+money(v)); p[field]=v; })
  .catch(function(e){ toast('Update failed: '+String(e.message||e).slice(0,60),4000,'#962d22'); refresh(); });
};
window.stockIn=function(i){
  var p=(window.__inv||[])[i]; if(!p) return;
  modal('<h3>Stock in \u2014 '+esc(p.name)+'</h3>'+
    '<div style="font-size:12px;color:var(--mut);margin-bottom:10px">On hand now: <b>'+num(p.stock)+' '+esc(p.unit||'pcs')+'</b></div>'+
    '<div class="fr"><label>Quantity to add (negative to remove)</label>'+
    '<input class="in" id="si-q" type="number" step="0.001" value="1"/></div>'+
    '<div class="fr"><label>Reason</label><select class="in" id="si-r">'+
      '<option value="stockin">Delivery received</option>'+
      '<option value="recount">Physical recount correction</option>'+
      '<option value="waste">Damaged / spoiled</option>'+
    '</select></div>'+
    '<div class="fr"><label>Reference (DR number, note)</label><input class="in" id="si-ref"/></div>'+
    '<div style="display:flex;gap:8px;margin-top:12px">'+
      '<button class="btn o" onclick="closeModal()">Cancel</button>'+
      '<button class="btn g" id="si-go" style="margin-left:auto">Record movement</button></div>');
  $('si-go').onclick=function(){
    var q=parseFloat($('si-q').value)||0;
    if(!q){ toast('Quantity cannot be zero',2000,'#962d22'); return; }
    var btn=this; btn.disabled=true; btn.textContent='Saving\u2026';
    api('stock_moves',{method:'POST',headers:{'Prefer':'resolution=ignore-duplicates,return=minimal'},
      body:JSON.stringify([{ id:uuid(), store_id:CFG.storeId, bc:String(p.bc), delta:q,
        reason:$('si-r').value, ref:$('si-ref').value||null, till_id:'dashboard',
        at:new Date().toISOString() }])})
    .then(function(){ closeModal(); toast('Movement recorded'); refresh(); })
    .catch(function(e){ btn.disabled=false; btn.textContent='Record movement';
      toast('Failed: '+String(e.message||e).slice(0,60),4000,'#962d22'); });
  };
};
window.exportInv=function(){
  var rows=[['Barcode','Code','Name','Category','Unit','Price','Cost','Stock','Reorder','Supplier','VAT-exempt','Expiry']];
  (window.__inv||[]).forEach(function(p){
    rows.push([p.bc,p.code||'',p.name,p.cat||'',p.unit||'pcs',r2(p.price),r2(p.cost),
               p.stock,p.rl||5,p.sup||'',p.vx?'YES':'NO',p.exp||'']);
  });
  dlCsv(rows,'inventory_'+dayKey()+'.csv');
};

/* ── CASH FLOW ────────────────────────────────────────────────────── */
var CASHTAB='sales';
function pCash(){
  return Promise.all([
    sel('daily_pl','biz_date=gte.'+STATE.from+'&biz_date=lte.'+STATE.to+'&select=*&order=biz_date.asc'),
    sel('expenses','biz_date=gte.'+STATE.from+'&biz_date=lte.'+STATE.to+'&select=*&order=at.desc'),
    sel('waste_logs','biz_date=gte.'+STATE.from+'&biz_date=lte.'+STATE.to+'&select=*&order=at.desc')
  ]).then(function(res){
    var pl=res[0]||[], exp=res[1]||[], waste=res[2]||[];
    var gross=pl.reduce(function(a,d){return r2(a+Number(d.gross||0));},0);
    var expT=exp.reduce(function(a,e){return r2(a+Number(e.amount||0));},0);
    var wstT=waste.reduce(function(a,w){return r2(a+Number(w.total_cost||0));},0);

    var tab='';
    if(CASHTAB==='sales'){
      tab='<div class="panel"><h3>Daily sales</h3>'+
        barChart(pl.map(function(d){ return {label:d.biz_date.slice(5), value:Number(d.gross||0)}; }))+'</div>'+
        tbl([{h:'Day'},{h:'Sales',r:1},{h:'Gross',r:1},{h:'Returns',r:1},{h:'Expenses',r:1},{h:'Waste',r:1},{h:'After costs',r:1}],
          pl.slice().reverse().map(function(d){
            return '<tr><td>'+esc(d.biz_date)+'</td><td class="r">'+num(d.sales_count)+'</td>'+
              '<td class="r">'+money(d.gross)+'</td><td class="r">'+money(d.returns)+'</td>'+
              '<td class="r">'+money(d.expense_total)+'</td><td class="r">'+money(d.waste_total)+'</td>'+
              '<td class="r"><b>'+money(d.after_costs)+'</b></td></tr>';
          }), 'No trading days in this range.');
    } else if(CASHTAB==='exp'){
      var byCat={};
      exp.forEach(function(e){ var k=e.category||'Other'; byCat[k]=r2((byCat[k]||0)+Number(e.amount||0)); });
      tab='<div class="panel"><h3>By category</h3>'+
        barChart(Object.keys(byCat).map(function(k){ return {label:k, value:byCat[k]}; }))+'</div>'+
        tbl([{h:'Date'},{h:'Description'},{h:'Category'},{h:'Logged by'},{h:'Amount',r:1}],
          exp.map(function(e){
            return '<tr><td>'+esc(e.biz_date)+'</td><td>'+esc(e.description)+'</td>'+
              '<td>'+esc(e.category||'')+'</td><td>'+esc(e.cashier||'')+'</td>'+
              '<td class="r">'+money(e.amount)+'</td></tr>';
          }), 'No expenses logged in this range.');
    } else {
      tab=tbl([{h:'Date'},{h:'Item'},{h:'Qty',r:1},{h:'Unit cost',r:1},{h:'Total',r:1},{h:'Reason'}],
          waste.map(function(w){
            return '<tr><td>'+esc(w.biz_date)+'</td><td>'+esc(w.product_name)+'</td>'+
              '<td class="r">'+num(w.qty)+'</td><td class="r">'+money(w.unit_cost)+'</td>'+
              '<td class="r">'+money(w.total_cost)+'</td><td>'+esc(w.reason||'')+'</td></tr>';
          }), 'No waste logged in this range.');
    }

    $('main').innerHTML =
      head('Cash Flow', esc(STATE.from)+' to '+esc(STATE.to))+
      '<div class="bar">'+
        '<input class="in" id="c-from" type="date" value="'+STATE.from+'"/>'+
        '<span style="color:var(--mut)">to</span>'+
        '<input class="in" id="c-to" type="date" value="'+STATE.to+'"/>'+
        '<button class="btn xs" onclick="applyCashF()">Apply</button></div>'+
      '<div class="cards">'+
        card('Gross sales', money(gross))+
        card('Expenses', money(expT))+
        card('Waste cost', money(wstT))+
        card('Sales less costs', money(r2(gross-expT-wstT)), 'excludes COGS')+
      '</div>'+
      '<div class="tabs">'+
        ctab('sales','Sales')+ctab('exp','Expenses')+ctab('waste','Waste')+
      '</div>'+tab;
  });
}
function card(k,v,n){ return '<div class="card"><div class="k">'+k+'</div><div class="v">'+v+'</div>'+
  (n?'<div class="n">'+esc(n)+'</div>':'')+'</div>'; }
function ctab(id,label){ return '<div class="tab'+(CASHTAB===id?' on':'')+'" onclick="CASHTAB=\''+id+'\';refresh()">'+label+'</div>'; }

function pReports(){
  return Promise.all([
    /* Was: limit=5000 with no date filter and no order. PostgREST does not
       guarantee row order without an order clause, so once a shop passed
       5,000 line items the "top products" table was computed over an
       arbitrary slice of all history - wrong, and wrong in a way that looks
       plausible. Bounded to the selected range and ordered so the limit is
       meaningful. If a range can exceed 5,000 lines, aggregate in SQL. */
    sel('sale_items','biz_date_calendar=gte.'+STATE.from+
        '&biz_date_calendar=lte.'+STATE.to+
        '&select=name,cat,qty,line_total,line_cost,cashier,type,at'+
        '&order=at.desc&limit=5000'),
    sel('z_reads','select=*&order=at.desc&limit=60')
  ]).then(function(res){
    var items=(res[0]||[]).filter(function(i){ return i.type==='sale'; });
    var zs=res[1]||[];

    var byProd={}, byCat={}, byCash={};
    items.forEach(function(i){
      var k=i.name||'?';
      byProd[k]=byProd[k]||{q:0,v:0,c:0};
      byProd[k].q+=Number(i.qty||0); byProd[k].v=r2(byProd[k].v+Number(i.line_total||0));
      byProd[k].c=r2(byProd[k].c+Number(i.line_cost||0));
      var ck=i.cat||'Other'; byCat[ck]=r2((byCat[ck]||0)+Number(i.line_total||0));
      var sk=i.cashier||'\u2014'; byCash[sk]=r2((byCash[sk]||0)+Number(i.line_total||0));
    });
    var prodRows=Object.keys(byProd).sort(function(a,b){ return byProd[b].v-byProd[a].v; }).slice(0,60)
      .map(function(k){ var p=byProd[k];
        return '<tr><td>'+esc(k)+'</td><td class="r">'+num(r2(p.q))+'</td>'+
          '<td class="r">'+money(p.v)+'</td><td class="r">'+money(p.c)+'</td>'+
          '<td class="r"><b>'+money(r2(p.v-p.c))+'</b></td></tr>'; });

    $('main').innerHTML =
      head('Reports', esc(STATE.from)+' to '+esc(STATE.to)+' \u00b7 '+
           num(items.length)+' line item'+(items.length===1?'':'s'),
REFRESH_BTN)+
      '<div class="bar">'+
        '<input class="in" id="r-from" type="date" value="'+STATE.from+'"/>'+
        '<span style="color:var(--mut)">to</span>'+
        '<input class="in" id="r-to" type="date" value="'+STATE.to+'"/>'+
        '<button class="btn xs" onclick="applyRepF()">Apply</button></div>'+
      (items.length>=5000
        ? '<div class="warn">This range returned the 5,000-line cap, so the '+
          'totals below are incomplete. Narrow the dates.</div>'
        : '')+
      '<div class="warn">These figures are rebuilt from the line items inside each stored receipt. '+
      'They will differ from a Z-Reading by fractions of a centavo, because the till rounds at the '+
      '<b>document</b> total and this rounds per line. For anything you file, the <b>Z-Reading is '+
      'authoritative</b> &mdash; it is the number that was printed and sequenced.</div>'+
      '<div class="panel"><h3>Sales by category</h3>'+
        barChart(Object.keys(byCat).map(function(k){ return {label:k, value:byCat[k]}; }))+'</div>'+
      '<div class="panel"><h3>Sales by cashier</h3>'+
        barChart(Object.keys(byCash).map(function(k){ return {label:k, value:byCash[k]}; }))+'</div>'+
      '<div class="panel"><h3>Top products</h3>'+
        tbl([{h:'Item'},{h:'Qty',r:1},{h:'Revenue',r:1},{h:'Cost',r:1},{h:'Margin',r:1}],
            prodRows,'No line items yet.')+'</div>'+
      '<div class="panel"><h3>Z-Readings archive</h3>'+
        tbl([{h:'Z#'},{h:'Day'},{h:'Till'},{h:'Txns',r:1},{h:'Gross',r:1},{h:'Net',r:1},
             {h:'VAT',r:1},{h:'Begin OR'},{h:'End OR'}],
          zs.map(function(z){
            return '<tr><td>'+num(z.z_number)+'</td><td>'+esc(z.biz_date)+'</td><td>'+esc(z.till_id)+'</td>'+
              '<td class="r">'+num(z.txn_count)+'</td><td class="r">'+money(z.gross_sales)+'</td>'+
              '<td class="r">'+money(z.net_sales)+'</td><td class="r">'+money(z.vat_amount)+'</td>'+
              '<td>'+esc(z.beginning_or||'')+'</td><td>'+esc(z.ending_or||'')+'</td></tr>';
          }), 'No Z-Readings have synced yet.')+'</div>';
  });
}

/* ══════════════════════════════════════════════════════════════════════
   INLINE SVG BAR CHART
   Deliberately not Chart.js. One dependency fewer, works with no signal,
   and a bar chart is about sixty lines. Scales to the tallest bar, skips
   labels when they would collide, and renders nothing rather than a
   broken axis when every value is zero.
   ══════════════════════════════════════════════════════════════════════ */
function barChart(data){
  data=(data||[]).filter(function(d){ return d && isFinite(d.value); });
  if(!data.length) return '<div class="empty">No data to chart.</div>';
  var max=Math.max.apply(null, data.map(function(d){ return Number(d.value)||0; }));
  if(max<=0) return '<div class="empty">Nothing recorded in this period.</div>';

  var W=880, H=200, padL=8, padB=26, padT=10;
  var n=data.length;
  var slot=(W-padL*2)/n, bw=Math.max(2, Math.min(46, slot*0.68));
  var everyLabel=Math.ceil(n/24);        // avoid overlapping tick text

  var bars=data.map(function(d,i){
    var v=Number(d.value)||0;
    var h=Math.max(v>0?2:0, (v/max)*(H-padT-padB));
    var x=padL+slot*i+(slot-bw)/2, y=H-padB-h;
    var t=esc(d.label)+': '+money(v);
    return '<g><title>'+t+'</title>'+
      '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+
      '" rx="2" fill="var(--brand)" opacity="'+(v>0?0.92:0.25)+'"></rect></g>'+
      (i%everyLabel===0
        ? '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-padB+14)+'" font-size="10" fill="#5d8aa8" '+
          'text-anchor="middle">'+esc(String(d.label).slice(0,9))+'</text>'
        : '');
  }).join('');

  return '<div style="overflow-x:auto">'+
    /* preserveAspectRatio="none" stretched the <text> glyphs along with the
       bars, so hour labels looked smeared on a wide monitor. */
    '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" '+
    'preserveAspectRatio="xMidYMid meet" style="min-width:520px;display:block">'+
      '<line x1="'+padL+'" y1="'+(H-padB)+'" x2="'+(W-padL)+'" y2="'+(H-padB)+'" stroke="#1e3a52"/>'+
      bars+
    '</svg>'+
    '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:4px">'+
      '<span>peak '+money(max)+'</span>'+
      '<span>total '+money(data.reduce(function(a,d){ return r2(a+(Number(d.value)||0)); },0))+'</span>'+
    '</div></div>';
}

/* ══ BOOT ══ */
function boot(){
  $('gate').classList.add('hide');
  $('shell').classList.remove('hide');
  $('s-user').textContent=SESS.email;
  buildNav();
  refresh().then(startLive);
}
brand();
/* Three ways in, cheapest first: a live access token in this tab, a refresh
   token from a previous visit, or the password gate. */
if(loadSess()) boot();
else resume().then(function(ok){ if(ok) boot(); else showGate(''); });
</script>
